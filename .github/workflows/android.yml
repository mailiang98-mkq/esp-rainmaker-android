name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew assembleRelease -x lintRelease --stacktrace
# ==================== 上传步骤（紧接在build后） ====================
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: esp-rainmaker-release-apk
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 30
